name: Build Hortator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip curl unzip
          pip3 install Pillow

      - name: Get JieLi toolchain and SDK
        run: |
          chmod +x build.sh tools/get_toolchain.sh
          ./tools/get_toolchain.sh
          git clone --depth 1 https://github.com ~/fw-AC79_AIoT_SDK

      - name: Build firmware
        run: |
          DRUM_PACKAGE=1 ./build.sh

      - name: Upload built firmware
        uses: actions/upload-artifact@v4
        with:
          name: hortator-no-leds
          path: build/*
