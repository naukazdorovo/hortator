name: Build Hortator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip curl unzip
          pip3 install Pillow

      - name: Download toolchain and SDK
        run: |
          chmod +x build.sh tools/get_toolchain.sh
          ./tools/get_toolchain.sh
          mkdir -p ~/fw-AC79_AIoT_SDK/cpu/wl82/tools/cfg
          cd ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          curl -fLO https://githubusercontent.com
          curl -fLO https://githubusercontent.com
          curl -fLo cfg/eq_cfg_hw.bin https://githubusercontent.com

      - name: Build
        run: DRUM_PACKAGE=1 ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hortator-no-leds
          path: build/*
